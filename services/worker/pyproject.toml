[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chalybcrypto-worker"
version = "0.0.1"
description = "Scanner + Celery tasks for ChalyCrypto."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "chalybcrypto-shared",
  "chalybcrypto-engine",
  "chalybcrypto-connectors",
]

[tool.setuptools.packages.find]
where = ["src"]
